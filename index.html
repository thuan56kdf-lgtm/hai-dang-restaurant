<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hải Đăng Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#151c25;color:white;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#101826c9;z-index:5}#panel{background:#202c3a;border:1px solid #506172;padding:32px;border-radius:14px;max-width:520px;text-align:center}h1{letter-spacing:3px}input,button{font:inherit;padding:12px;border-radius:7px;border:0}button{background:#e2ad53;color:#18202a;font-weight:bold;cursor:pointer}#hud{position:fixed;inset:0;pointer-events:none}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:28px monospace;color:white;text-shadow:0 0 4px black}#bottom{position:absolute;bottom:22px;left:24px;background:#151c25ba;padding:12px;border-radius:8px}#hp{display:flex;gap:4px;margin:7px 0}#hp i{width:25px;height:9px;background:#60d79b;border-radius:2px}#top{position:absolute;top:16px;left:20px;background:#151c25b8;padding:12px;border-radius:8px}#scores{position:absolute;right:20px;top:16px;background:#151c25b8;padding:12px;border-radius:8px;white-space:pre-line}#msg{position:absolute;top:38%;width:100%;text-align:center;font-size:24px;font-weight:bold}#hint{position:absolute;bottom:20px;right:20px;font-size:13px;color:#ddd}#hit{position:absolute;inset:0;box-shadow:inset 0 0 90px 30px #e34343;opacity:0}</style><canvas id="c"></canvas><div id="hud"><div id="hit"></div><div id="cross">+</div><div id="top">HẢI ĐĂNG ARENA V4</div><div id="scores"></div><div id="msg"></div><div id="bottom">MÁU <span id="num">6/6</span><div id="hp"></div><span id="weapon">1 · Súng ngắn</span></div><div id="hint">W A S D · Chuột ngắm · Click bắn · 1 / 2 đổi súng · Esc thoát chuột</div></div><div id="overlay"><div id="panel"><h1>HẢI ĐĂNG ARENA V4</h1><p>Đấu trường FPS trực tuyến</p><input id="name" maxlength="20" placeholder="Tên người chơi"><button id="join">Vào trận</button><p>WASD di chuyển • Chuột để ngắm • Chuột trái để bắn</p><p>1: súng ngắn · 2: súng dài · 6 máu · hồi sinh sau 2,5 giây</p><small id="status"></small></div></div><script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let id=null,players=[],walls=[],me=null,yaw=0,pitch=0,gun=0,keys={},fire=false,clock=0,offset=0,wasDead=false,lastHp=6;let visual=null,remote=new Map(),tracers=[],seen=new Set(),lastFrame=performance.now();const colors=['#718594','#9a8b76','#617b83'];
function size(){c.width=innerWidth* Math.min(devicePixelRatio,1.5);c.height=innerHeight*Math.min(devicePixelRatio,1.5)}addEventListener('resize',size);size();
async function post(url,d){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw Error(await r.text());return r.json()}
$('join').onclick=async()=>{try{$('status').textContent='Đang kết nối…';if(!id){let d=await post('/join',{name:$('name').value});id=d.id;walls=d.walls;poll()}$('overlay').style.display='none';c.requestPointerLock?.()}catch(e){$('status').textContent='Không kết nối được máy chủ.'}};
c.onclick=()=>{if(id&&document.pointerLockElement!==c)c.requestPointerLock?.()};document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==c){keys={};fire=false;if(id)$('msg').textContent='Bấm vào màn hình để tiếp tục'}else $('msg').textContent=''});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===c){yaw+=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025))}});addEventListener('keydown',e=>{if(!id)return;let k=e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){keys[k]=true;e.preventDefault()}if(k==='1')gun=0;if(k==='2')gun=1});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousedown',e=>{if(e.button===0&&document.pointerLockElement===c)fire=true});addEventListener('mouseup',()=>fire=false);addEventListener('blur',()=>{keys={};fire=false});
async function poll(){if(!id)return;try{let d=await post('/input',{id,yaw,pitch,gun,keys,fire});players=d.players;clock=d.now;offset=Date.now()-clock;me=players.find(p=>p.id===id);for(const shot of d.shots||[]){if(!seen.has(shot.id)){seen.add(shot.id);tracers.push({...shot,born:performance.now()})}}if(seen.size>2000)seen.clear();for(const p of players){if(p.id!==id){let r=remote.get(p.id);if(!r||r.dead||p.dead)remote.set(p.id,{...p});}}for(const k of remote.keys())if(!players.some(p=>p.id===k))remote.delete(k);if(me){if(!visual||wasDead||me.dead||Math.hypot(visual.x-me.x,visual.z-me.z)>4)visual={x:me.x,z:me.z};if(wasDead&&!me.dead){yaw=me.yaw;pitch=0}wasDead=!!me.dead;$('num').textContent=me.hp+'/6';$('hp').innerHTML=Array.from({length:6},(_,i)=>`<i style="background:${i<me.hp?'#60d79b':'#414a54'}"></i>`).join('');$('weapon').textContent=gun?'2 · Súng dài':'1 · Súng ngắn';$('scores').textContent='ĐANG CHƠI: '+players.length+'\n'+players.slice().sort((a,b)=>b.score-a.score).map(p=>p.name+'  '+p.score+' / '+p.deaths).join('\n');$('hit').style.opacity=me.hit&&clock-me.hit<180?.7:0; $('msg').textContent=me.dead?'HỒI SINH SAU '+Math.max(1,Math.ceil((me.dead-clock)/1000))+' GIÂY':document.pointerLockElement!==c?'Bấm vào màn hình để tiếp tục':''}}catch(e){$('msg').textContent='Mất kết nối — tải lại trang nếu cần'}setTimeout(poll,25)}
// Perspective projection with near-plane clipping, flat-shaded polygon rendering.
function render(){requestAnimationFrame(render);let now=performance.now(),dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;let W=c.width,H=c.height;ctx.fillStyle='#9cb6c6';ctx.fillRect(0,0,W,H);if(!me||!visual)return;let fwd=Number(!!keys.w)-Number(!!keys.s),side=Number(!!keys.d)-Number(!!keys.a),n=Math.hypot(fwd,side)||1;function blocked(x,z){return walls.some(([a,b,w,h])=>x>a-.35&&x<a+w+.35&&z>b-.35&&z<b+h+.35)}if(!me.dead){let dx=(Math.sin(yaw)*fwd+Math.cos(yaw)*side)*4*dt/n,dz=(-Math.cos(yaw)*fwd+Math.sin(yaw)*side)*4*dt/n;if(!blocked(visual.x+dx,visual.z))visual.x+=dx;if(!blocked(visual.x,visual.z+dz))visual.z+=dz;let moving=fwd||side,k=1-Math.exp(-dt*(moving?3:12));let tx=visual.x+(me.x-visual.x)*k,tz=visual.z+(me.z-visual.z)*k;if(!blocked(tx,visual.z))visual.x=tx;if(!blocked(visual.x,tz))visual.z=tz;}for(const p of players){let r=remote.get(p.id);if(r){let k=1-Math.exp(-dt*14);r.x+=(p.x-r.x)*k;r.z+=(p.z-r.z)*k;r.dead=p.dead;r.hp=p.hp;r.name=p.name;}}let f=W*.72,cy=H/2+Math.tan(pitch)*f,sy=Math.sin(yaw),co=Math.cos(yaw),faces=[];ctx.fillStyle='#68736e';ctx.fillRect(0,Math.max(0,cy),W,H);function camera(v){let x=v[0]-visual.x,z=v[2]-visual.z;return [x*co+z*sy,v[1]-1.55,x*sy-z*co]}function poly(v,color){let a=v.map(camera),b=[];for(let i=0;i<a.length;i++){let p=a[i],q=a[(i+1)%a.length],pin=p[2]>=.08,qin=q[2]>=.08;if(pin)b.push(p);if(pin!==qin){let t=(.08-p[2])/(q[2]-p[2]);b.push(p.map((x,j)=>x+(q[j]-x)*t))}}if(b.length<3)return;faces.push({z:b.reduce((s,p)=>s+p[2],0)/b.length,color,pts:b.map(p=>[W/2+p[0]*f/p[2],cy-p[1]*f/p[2]])})}function box(x,z,w,d,y,h,col){let X=x+w,Z=z+d,Y=y+h;poly([[x,y,z],[X,y,z],[X,Y,z],[x,Y,z]],col[0]);poly([[X,y,Z],[x,y,Z],[x,Y,Z],[X,Y,Z]],col[0]);poly([[x,y,Z],[x,y,z],[x,Y,z],[x,Y,Z]],col[1]);poly([[X,y,z],[X,y,Z],[X,Y,Z],[X,Y,z]],col[1]);poly([[x,Y,z],[X,Y,z],[X,Y,Z],[x,Y,Z]],col[2])}for(let x=1;x<39;x+=4)for(let z=1;z<39;z+=4)poly([[x,0,z],[Math.min(x+3.94,39),0,z],[Math.min(x+3.94,39),0,Math.min(z+3.94,39)],[x,0,Math.min(z+3.94,39)]],(x+z)%8===2?'#77817a':'#818a82');for(let [x,z,w,d] of walls)box(x,z,w,d,0,3.3,['#8795a1','#647481','#a8b4bd']);for(let p of remote.values()){if(p.dead)continue;box(p.x-.35,p.z-.24,.7,.48,.65,.85,['#c58b42','#9c6533','#e0a65a']);box(p.x-.23,p.z-.23,.46,.46,1.5,.48,['#d7b48b','#aa8a6b','#e9c7a1']);box(p.x-.32,p.z-.18,.25,.35,0,.65,['#344554','#263440','#50616e']);box(p.x+.07,p.z-.18,.25,.35,0,.65,['#344554','#263440','#50616e'])}function visible(x,z){let dx=x-visual.x,dz=z-visual.z;for(let i=1;i<Math.ceil(Math.hypot(dx,dz)*5);i++){let t=i/Math.ceil(Math.hypot(dx,dz)*5);if(walls.some(([a,b,w,h])=>visual.x+dx*t>a&&visual.x+dx*t<a+w&&visual.z+dz*t>b&&visual.z+dz*t<b+h))return false;}return true}for(const p of remote.values()){if(p.dead||!visible(p.x,p.z))continue;let v=camera([p.x,2.25,p.z]);if(v[2]>.15)faces.push({z:v[2],label:p.name,hp:p.hp,px:W/2+v[0]*f/v[2],py:cy-v[1]*f/v[2]});}faces.sort((a,b)=>b.z-a.z);for(let p of faces){if(p.label!==undefined){ctx.font=`bold ${Math.max(12,Math.min(22,W/65))}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#15202b';ctx.strokeText(p.label,p.px,p.py);ctx.fillStyle='white';ctx.fillText(p.label,p.px,p.py);ctx.fillStyle='#26313a';ctx.fillRect(p.px-21,p.py+5,42,4);ctx.fillStyle='#60d79b';ctx.fillRect(p.px-21,p.py+5,42*p.hp/6,4);continue;}ctx.beginPath();p.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=p.color;ctx.fill()}// Draw short-lived world-space tracers, clipped to the camera and hidden behind walls.
tracers=tracers.filter(t=>now-t.born<260);for(const t of tracers){let age=(now-t.born)/260,steps=24;ctx.strokeStyle=`rgba(255,211,105,${1-age})`;ctx.lineWidth=2.5;ctx.beginPath();let prev=false;for(let i=0;i<=steps;i++){let u=i/steps,x=t.x+(t.ex-t.x)*u,z=t.z+(t.ez-t.z)*u,y=t.y+(t.ey-t.y)*u,v=camera([x,y,z]);if(v[2]<.18||!visible(x,z)){prev=false;continue}let px=W/2+v[0]*f/v[2],py=cy-v[1]*f/v[2];if(prev)ctx.lineTo(px,py);else ctx.moveTo(px,py);prev=true}ctx.stroke();}
// Stylized first-person weapon.
let scale=H/700;ctx.save();ctx.translate(W*.66,H);ctx.scale(scale,scale);let recoil=me.flash&&Date.now()-offset-me.flash<100?12:0;ctx.translate(0,recoil);ctx.fillStyle='#b68d69';ctx.fillRect(-15,-90,65,110);ctx.fillStyle='#303943';ctx.fillRect(-30,-120,74,100);ctx.fillStyle='#56616a';ctx.fillRect(-42,gun?-250:-170,65,gun?140:60);ctx.fillStyle='#1e252b';ctx.fillRect(-30,gun?-280:-180,41,gun?45:25);if(recoil){ctx.fillStyle='#ffcf65';ctx.beginPath();ctx.arc(-10,gun?-285:-185,20,0,7);ctx.fill()}ctx.restore();if(me.dead){ctx.fillStyle='#151c2588';ctx.fillRect(0,0,W,H)}}render();
