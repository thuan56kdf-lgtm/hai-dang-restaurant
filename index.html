<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hải Đăng • Nhà hàng trực tuyến</title><style>
*{box-sizing:border-box}body{margin:0;background:#172722;color:#f7f0df;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,35px);margin:4px 0}small{letter-spacing:3px;color:#d9bb83}button,input{font:inherit;border:0;border-radius:8px;padding:12px}button{background:#d9bb83;color:#172722;font-weight:700;cursor:pointer}input{background:#f5eddd;color:#172722;max-width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.bar span{margin-left:auto}svg{width:100%;display:block;background:#d8c3a1;border:3px solid #9d845a;border-radius:12px;touch-action:manipulation}#players>g{transition:transform .65s linear;pointer-events:none}.chair{cursor:pointer}.chair:hover rect{stroke:#fff;stroke-width:3}footer{color:#c3cfc5;font-size:14px;margin-top:12px}#status{color:#e3c68e}.occupied{fill:#a35d47!important}#chatlog{height:180px;overflow:auto;background:#101f1a;padding:12px;border-radius:10px;overflow-wrap:anywhere}#chatlog p{margin:5px 0}#chatForm{display:flex;gap:8px;margin-top:8px}#chatText{flex:1;min-width:0}dialog{border:1px solid #d9bb83;border-radius:15px;background:#24382f;color:#fff;max-width:95vw;width:430px}dialog select{width:100%;padding:12px;margin:8px 0 18px;font:inherit} .portal{cursor:pointer} .portal:hover{filter:brightness(1.2)}#roomScene text{pointer-events:none}</style>
<main><header><div><small>HẢI ĐĂNG SOCIAL CLUB</small><h1>Nhà hàng trực tuyến</h1></div><button id="share">Sao chép link mời</button></header><div class="bar"><input id="name" maxlength="24" placeholder="Tên của bạn"><button id="join">Tham gia</button><span id="count">0 người · 24 ghế</span></div><svg id="floor" viewBox="0 0 1000 560" aria-label="Mặt bằng nhà hàng 3 bàn 24 ghế"><defs><pattern id="tile" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#e0d2b9"/><path d="M0 0H70V70" fill="none" stroke="#bbaa91" stroke-width="1"/></pattern><pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#a4774c"/><path d="M0 4H12M0 9H12" stroke="#b88b60" stroke-width=".7"/></pattern><filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".23"/></filter></defs><rect x="14" y="14" width="972" height="532" rx="5" fill="url(#tile)" stroke="#6e6653" stroke-width="14"/><path d="M450 546H550" stroke="#e0d2b9" stroke-width="16"/><text x="500" y="532" text-anchor="middle" fill="#6d634f" font-size="12">LỐI VÀO</text><g id="hall"><rect x="330" y="24" width="340" height="40" rx="6" fill="url(#wood)"/><text x="500" y="49" text-anchor="middle" font-size="15" fill="#fff3d6">QUẦY LỄ TÂN · GỌI MÓN</text><g id="decor"></g><g id="tables"></g><g id="reception" class="portal"><rect x="330" y="24" width="340" height="40" rx="6" fill="transparent"/></g><g class="portal" id="secret1"><rect x="90" y="24" width="120" height="48" rx="6" fill="#4b385d"/><text x="150" y="53" text-anchor="middle" fill="white" font-size="15">BÍ MẬT 1</text></g><g class="portal" id="secret2"><rect x="790" y="24" width="120" height="48" rx="6" fill="#4b385d"/><text x="850" y="53" text-anchor="middle" fill="white" font-size="15">BÍ MẬT 2</text></g></g><g id="roomScene" style="display:none"></g><g id="players"></g></svg><footer><span id="status">Nhập tên để tham gia.</span> · Bấm sàn để di chuyển, bấm ghế để ngồi. Bấm vị trí khác để đứng dậy.</footer><section><h2>💬 Chat chung nhà hàng</h2><div id="chatlog" role="log" aria-live="polite"></div><form id="chatForm"><input id="chatText" maxlength="250" placeholder="Nhập tin nhắn…" autocomplete="off"><button>Gửi</button></form></section><p><button id="back" hidden>← Về nhà hàng</button> <button id="sound" hidden>🔊 Bật / tắt nhạc</button></p></main><dialog id="menu"><h2>🍽 Menu nhà hàng</h2><label>Món ăn<select id="food"><option value="">Không chọn</option><option>Thịt chó</option><option>Gà rán</option><option>Lẩu gà</option><option>Quẩy nóng</option></select></label><label>Đồ uống<select id="drink"><option value="">Không chọn</option><option>Rượu</option><option>Nước ngọt</option><option>Bia</option><option>Bia không cồn</option></select></label><button id="order">Nhận món</button> <button id="closeMenu">Đóng</button></dialog>
<script>
const ns='http://www.w3.org/2000/svg',floor=document.querySelector('#floor'),tables=document.querySelector('#tables'),players=document.querySelector('#players');let id,source,people=[],zone="hall",chatKey="",audio,tick,muted=false,nodes=new Map(),chairs=new Map();const room=new URLSearchParams(location.search).get('room')||'hai-dang';const endpoint=(p)=>p+'?room='+encodeURIComponent(room);const status=t=>document.querySelector('#status').textContent=t;
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent?.appendChild(e);return e}
for(const [x,y] of [[48,48],[952,48],[48,510],[952,510]]){const g=el('g',{},document.querySelector('#decor'));el('circle',{cx:x,cy:y,r:23,fill:'#846849'},g);for(let i=0;i<7;i++){let a=i*2*Math.PI/7;el('ellipse',{cx:x+Math.cos(a)*10,cy:y+Math.sin(a)*10,rx:8,ry:15,fill:i%2?'#486b49':'#6b8b53',transform:`rotate(${i*360/7} ${x+Math.cos(a)*10} ${y+Math.sin(a)*10})`},g)}}
[190,500,810].forEach((x,t)=>{let y=245;el('circle',{cx:x,cy:y,r:132,fill:'#b6a48c',opacity:.35},tables);el('circle',{cx:x,cy:y,r:78,fill:'url(#wood)',stroke:'#77512f','stroke-width':3,filter:'url(#shadow)'},tables);el('circle',{cx:x,cy:y,r:66,fill:'#f1eadb'},tables);el('circle',{cx:x,cy:y,r:23,fill:'#79956c'},tables);let label=el('text',{x,y:y+5,'text-anchor':'middle',fill:'white','font-size':13},tables);label.textContent='BÀN '+(t+1);for(let i=0;i<8;i++){let a=i*Math.PI/4-Math.PI/2,cx=x+Math.cos(a)*99,cy=y+Math.sin(a)*99,k=t+'-'+i;let g=el('g',{transform:`translate(${cx} ${cy}) rotate(${a*180/Math.PI+90})`,class:'chair'},tables);let r=el('rect',{x:-17,y:-16,width:34,height:35,rx:7,fill:'#647d68',stroke:'#3b5547','stroke-width':3},g);el('path',{d:'M-15 -11H15',stroke:'#d5c1a0','stroke-width':4},g);chairs.set(k,r);g.addEventListener('click',e=>{e.stopPropagation();move(cx,cy,k)});el('circle',{cx:x+Math.cos(a)*53,cy:y+Math.sin(a)*53,r:11,fill:'#fff',stroke:'#c8bc9e'},tables)}});
function render(){const mine=people.find(p=>p.id===id);if(mine&&zone!==mine.zone){zone=mine.zone;showZone()}const visible=people.filter(p=>p.zone===zone);let active=new Set(visible.map(p=>p.id));for(const [k,g] of nodes)if(!active.has(k)){g.remove();nodes.delete(k)}for(const p of visible){let g=nodes.get(p.id);if(!g){g=el('g',{},players);el('ellipse',{cx:2,cy:8,rx:15,ry:12,fill:'#000',opacity:.2},g);el('ellipse',{cx:0,cy:4,rx:17,ry:12,fill:p.color,stroke:p.id===id?'#fff':'#514638','stroke-width':2},g);el('circle',{cx:0,cy:-4,r:10,fill:'#e9b68c'},g);el('path',{d:'M-9 -6Q0 -17 9 -6',fill:'#3e3027'},g);let text=el('text',{x:0,y:-22,'text-anchor':'middle','font-size':12,'font-weight':'bold',fill:'#23382e',stroke:'#fff','stroke-width':3,'paint-order':'stroke'},g);text.textContent=p.name+(p.id===id?' (Bạn)':'');let tray=el('text',{x:21,y:12,'font-size':24},g);tray.classList.add('tray');let meal=el('text',{x:0,y:34,'text-anchor':'middle','font-size':11,fill:'#26352a',stroke:'#fff','stroke-width':3,'paint-order':'stroke'},g);meal.classList.add('meal');nodes.set(p.id,g)}g.querySelector('.tray').textContent=(p.food?icons[p.food]:'')+(p.drink?icons[p.drink]:'');g.querySelector('.meal').textContent=[p.food,p.drink].filter(Boolean).join(' · ');g.setAttribute('transform',`translate(${p.x} ${p.y})`)}for(const [k,r] of chairs)r.classList.toggle('occupied',people.some(p=>p.seat===k));document.querySelector('#count').textContent=people.length+' người · '+(24-people.filter(p=>p.seat).length)+' ghế trống'}
function join(){source?.close();id=null;let name=document.querySelector('#name').value.trim()||'Khách';source=new EventSource(endpoint('/join')+'&name='+encodeURIComponent(name));source.addEventListener('id',e=>{id=e.data;status('Đã kết nối · Bạn có thể di chuyển')});source.onmessage=e=>{const data=JSON.parse(e.data);people=data.people;render();renderChat(data.chat)};source.onerror=()=>{id=null;status('Mất kết nối, đang thử kết nối lại…')}}
async function move(x,y,seat=null){if(!id){status('Hãy tham gia trước.');return}if(zone==='hall'&&!seat&&[190,500,810].some(c=>Math.hypot(x-c,y-245)<82)){status('Hãy chọn lối đi hoặc ghế.');return}try{const r=await fetch(endpoint('/move'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,x,y,seat})});status(r.status===409?'Ghế đã có người ngồi.':r.ok?(seat?'Bạn đang ngồi tại bàn '+(Number(seat[0])+1):'Đang di chuyển'):'Không thể di chuyển')}catch{status('Mất kết nối')}}
floor.addEventListener('click',e=>{let p=floor.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(floor.getScreenCTM().inverse());move(p.x,p.y)});document.querySelector('#join').onclick=join;document.querySelector('#name').onkeydown=e=>{if(e.key==='Enter')join()};document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status('Đã sao chép link mời.')}catch{prompt('Sao chép đường link:',location.href)}};

const $=s=>document.querySelector(s),icons={'Thịt chó':'🍖','Gà rán':'🍗','Lẩu gà':'🍲','Quẩy nóng':'🥖','Rượu':'🍶','Nước ngọt':'🥤','Bia':'🍺','Bia không cồn':'🍺'};
async function send(path,data){if(!id){status('Hãy tham gia trước.');return false}try{const r=await fetch(endpoint(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...data})});if(!r.ok)status('Không thực hiện được. Hãy thử lại.');return r.ok}catch{status('Mất kết nối');return false}}
async function approach(x,action){if(!id){status('Hãy tham gia trước.');return}await move(x,90);if(people.find(p=>p.id===id)?.zone!=='hall')return;await new Promise(r=>setTimeout(r,700));await action()}
$('#reception').onclick=e=>{e.stopPropagation();approach(500,()=>{const p=people.find(p=>p.id===id);if(!p||Math.hypot(p.x-500,p.y-90)>65)return;$('#food').value=p.food||'';$('#drink').value=p.drink||'';$('#menu').showModal()})};
$('#secret1').onclick=e=>{e.stopPropagation();approach(150,()=>send('/zone',{zone:'karaoke'}))};$('#secret2').onclick=e=>{e.stopPropagation();approach(850,()=>send('/zone',{zone:'wc'}))};
$('#order').onclick=async()=>{if(await send('/order',{food:$('#food').value||null,drink:$('#drink').value||null})){$('#menu').close();status('Đã nhận món!')}};$('#closeMenu').onclick=()=>$('#menu').close();
$('#chatForm').onsubmit=async e=>{e.preventDefault();const t=$('#chatText').value.trim();if(t&&await send('/chat',{text:t}))$('#chatText').value=''};
function renderChat(chat){const key=JSON.stringify(chat);if(key===chatKey)return;chatKey=key;const log=$('#chatlog');log.replaceChildren();for(const m of chat){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=m.name+': ';p.append(b,document.createTextNode(m.text));log.append(p)}log.scrollTop=log.scrollHeight}
function stopMusic(){clearInterval(tick);tick=null;if(audio){audio.close();audio=null}}
function startMusic(){if(muted||tick||zone!=='karaoke')return;try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let i=0;const notes=[261.63,329.63,392,440,392,329.63,293.66,349.23,440,523.25,440,349.23,329.63,392,493.88,392];const play=()=>{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(audio.destination);o.start();o.stop(t+.4)};play();tick=setInterval(play,380)}catch{status('Bấm bật nhạc để nghe')}}
function showZone(){for(const g of nodes.values())g.remove();nodes.clear();$('#hall').style.display=zone==='hall'?'':'none';const scene=$('#roomScene');scene.style.display=zone==='hall'?'none':'';$('#back').hidden=zone==='hall';$('#sound').hidden=zone!=='karaoke';stopMusic();scene.replaceChildren();if(zone==='hall')return;scene.innerHTML=zone==='karaoke'?`<rect x="25" y="25" width="950" height="510" rx="15" fill="#38294e"/><rect x="310" y="45" width="380" height="110" rx="12" fill="#121729" stroke="#dba6ff" stroke-width="4"/><text x="500" y="110" text-anchor="middle" font-size="33" fill="#f4bfff">♫ KARAOKE ♫</text><rect x="65" y="150" width="120" height="300" rx="25" fill="#a05b92"/><rect x="815" y="150" width="120" height="300" rx="25" fill="#a05b92"/><rect x="320" y="200" width="360" height="100" rx="35" fill="#9b719d"/><circle cx="500" cy="365" r="55" fill="#675280" stroke="#c7a4dd"/><text x="500" y="505" text-anchor="middle" fill="white">PHÒNG HÁT BÍ MẬT</text>`:`<rect x="25" y="25" width="950" height="510" rx="12" fill="#b5d4d6"/><text x="500" y="70" text-anchor="middle" font-size="30" fill="#26494d">WC</text><g fill="#f9ffff" stroke="#719da0" stroke-width="4"><rect x="80" y="110" width="230" height="210" rx="12"/><rect x="385" y="110" width="230" height="210" rx="12"/><rect x="690" y="110" width="230" height="210" rx="12"/><ellipse cx="195" cy="200" rx="45" ry="60"/><ellipse cx="500" cy="200" rx="45" ry="60"/><ellipse cx="805" cy="200" rx="45" ry="60"/><rect x="80" y="385" width="240" height="65" rx="20"/></g><text x="200" y="425" text-anchor="middle" fill="#26494d">Rửa tay</text>`;if(zone==='karaoke'){startMusic();status('Phòng karaoke · Bấm nút nhạc nếu trình duyệt chặn âm thanh.')}else status('Bạn đã vào WC')}
$('#back').onclick=()=>send('/zone',{zone:'hall'});$('#sound').onclick=()=>{if(tick){muted=true;stopMusic()}else{muted=false;startMusic()}};
</script></html>
