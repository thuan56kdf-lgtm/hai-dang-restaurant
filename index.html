<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hải Đăng • Nhà hàng trực tuyến</title><style>
*{box-sizing:border-box}body{margin:0;background:#172722;color:#f7f0df;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,35px);margin:4px 0}small{letter-spacing:3px;color:#d9bb83}button,input{font:inherit;border:0;border-radius:8px;padding:12px}button{background:#d9bb83;color:#172722;font-weight:700;cursor:pointer}input{background:#f5eddd;color:#172722;max-width:100%}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.bar span{margin-left:auto}svg{width:100%;display:block;background:#d8c3a1;border:3px solid #9d845a;border-radius:12px;touch-action:manipulation}#players>g{transition:transform .65s linear;pointer-events:none}.chair{cursor:pointer}.chair:hover rect{stroke:#fff;stroke-width:3}footer{color:#c3cfc5;font-size:14px;margin-top:12px}#status{color:#e3c68e}.occupied{fill:#a35d47!important}</style>
<main><header><div><small>HẢI ĐĂNG SOCIAL CLUB</small><h1>Nhà hàng trực tuyến</h1></div><button id="share">Sao chép link mời</button></header><div class="bar"><input id="name" maxlength="24" placeholder="Tên của bạn"><button id="join">Tham gia</button><span id="count">0 người · 24 ghế</span></div><svg id="floor" viewBox="0 0 1000 560" aria-label="Mặt bằng nhà hàng 3 bàn 24 ghế"><defs><pattern id="tile" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="70" height="70" fill="#e0d2b9"/><path d="M0 0H70V70" fill="none" stroke="#bbaa91" stroke-width="1"/></pattern><pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#a4774c"/><path d="M0 4H12M0 9H12" stroke="#b88b60" stroke-width=".7"/></pattern><filter id="shadow"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity=".23"/></filter></defs><rect x="14" y="14" width="972" height="532" rx="5" fill="url(#tile)" stroke="#6e6653" stroke-width="14"/><path d="M450 546H550" stroke="#e0d2b9" stroke-width="16"/><text x="500" y="532" text-anchor="middle" fill="#6d634f" font-size="12">LỐI VÀO</text><rect x="330" y="24" width="340" height="40" rx="6" fill="url(#wood)"/><text x="500" y="49" text-anchor="middle" font-size="15" fill="#fff3d6">QUẦY PHỤC VỤ</text><g id="decor"></g><g id="tables"></g><g id="players"></g></svg><footer><span id="status">Nhập tên để tham gia.</span> · Bấm sàn để di chuyển, bấm ghế để ngồi. Bấm vị trí khác để đứng dậy.</footer></main>
<script>
const ns='http://www.w3.org/2000/svg',floor=document.querySelector('#floor'),tables=document.querySelector('#tables'),players=document.querySelector('#players');let id,source,people=[],nodes=new Map(),chairs=new Map();const room=new URLSearchParams(location.search).get('room')||'hai-dang';const endpoint=(p)=>p+'?room='+encodeURIComponent(room);const status=t=>document.querySelector('#status').textContent=t;
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent?.appendChild(e);return e}
for(const [x,y] of [[48,48],[952,48],[48,510],[952,510]]){const g=el('g',{},document.querySelector('#decor'));el('circle',{cx:x,cy:y,r:23,fill:'#846849'},g);for(let i=0;i<7;i++){let a=i*2*Math.PI/7;el('ellipse',{cx:x+Math.cos(a)*10,cy:y+Math.sin(a)*10,rx:8,ry:15,fill:i%2?'#486b49':'#6b8b53',transform:`rotate(${i*360/7} ${x+Math.cos(a)*10} ${y+Math.sin(a)*10})`},g)}}
[190,500,810].forEach((x,t)=>{let y=245;el('circle',{cx:x,cy:y,r:132,fill:'#b6a48c',opacity:.35},tables);el('circle',{cx:x,cy:y,r:78,fill:'url(#wood)',stroke:'#77512f','stroke-width':3,filter:'url(#shadow)'},tables);el('circle',{cx:x,cy:y,r:66,fill:'#f1eadb'},tables);el('circle',{cx:x,cy:y,r:23,fill:'#79956c'},tables);let label=el('text',{x,y:y+5,'text-anchor':'middle',fill:'white','font-size':13},tables);label.textContent='BÀN '+(t+1);for(let i=0;i<8;i++){let a=i*Math.PI/4-Math.PI/2,cx=x+Math.cos(a)*99,cy=y+Math.sin(a)*99,k=t+'-'+i;let g=el('g',{transform:`translate(${cx} ${cy}) rotate(${a*180/Math.PI+90})`,class:'chair'},tables);let r=el('rect',{x:-17,y:-16,width:34,height:35,rx:7,fill:'#647d68',stroke:'#3b5547','stroke-width':3},g);el('path',{d:'M-15 -11H15',stroke:'#d5c1a0','stroke-width':4},g);chairs.set(k,r);g.addEventListener('click',e=>{e.stopPropagation();move(cx,cy,k)});el('circle',{cx:x+Math.cos(a)*53,cy:y+Math.sin(a)*53,r:11,fill:'#fff',stroke:'#c8bc9e'},tables)}});
function render(){let active=new Set(people.map(p=>p.id));for(const [k,g] of nodes)if(!active.has(k)){g.remove();nodes.delete(k)}for(const p of people){let g=nodes.get(p.id);if(!g){g=el('g',{},players);el('ellipse',{cx:2,cy:8,rx:15,ry:12,fill:'#000',opacity:.2},g);el('ellipse',{cx:0,cy:4,rx:17,ry:12,fill:p.color,stroke:p.id===id?'#fff':'#514638','stroke-width':2},g);el('circle',{cx:0,cy:-4,r:10,fill:'#e9b68c'},g);el('path',{d:'M-9 -6Q0 -17 9 -6',fill:'#3e3027'},g);let text=el('text',{x:0,y:-22,'text-anchor':'middle','font-size':12,'font-weight':'bold',fill:'#23382e',stroke:'#fff','stroke-width':3,'paint-order':'stroke'},g);text.textContent=p.name+(p.id===id?' (Bạn)':'');nodes.set(p.id,g)}g.setAttribute('transform',`translate(${p.x} ${p.y})`)}for(const [k,r] of chairs)r.classList.toggle('occupied',people.some(p=>p.seat===k));document.querySelector('#count').textContent=people.length+' người · '+(24-people.filter(p=>p.seat).length)+' ghế trống'}
function join(){source?.close();id=null;let name=document.querySelector('#name').value.trim()||'Khách';source=new EventSource(endpoint('/join')+'&name='+encodeURIComponent(name));source.addEventListener('id',e=>{id=e.data;status('Đã kết nối · Bạn có thể di chuyển')});source.onmessage=e=>{people=JSON.parse(e.data);render()};source.onerror=()=>{id=null;status('Mất kết nối, đang thử kết nối lại…')}}
async function move(x,y,seat=null){if(!id){status('Hãy tham gia trước.');return}if(!seat&&[190,500,810].some(c=>Math.hypot(x-c,y-245)<82)){status('Hãy chọn lối đi hoặc ghế.');return}try{const r=await fetch(endpoint('/move'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,x,y,seat})});status(r.status===409?'Ghế đã có người ngồi.':r.ok?(seat?'Bạn đang ngồi tại bàn '+(Number(seat[0])+1):'Đang di chuyển'):'Không thể di chuyển')}catch{status('Mất kết nối')}}
floor.addEventListener('click',e=>{let p=floor.createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform(floor.getScreenCTM().inverse());move(p.x,p.y)});document.querySelector('#join').onclick=join;document.querySelector('#name').onkeydown=e=>{if(e.key==='Enter')join()};document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);status('Đã sao chép link mời.')}catch{prompt('Sao chép đường link:',location.href)}};
</script></html>
